---
name: Run tests

on:
  workflow_call:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    name: Run unit tests
    steps:
      - id: git-checkout
        name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Run unit tests
        run: uv run pytest

  tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    name: Run initializer test script
    steps:
      - id: git-checkout
        name: Checkout
        uses: actions/checkout@v7
      - id: test-script-1
        name: Test the initializers (First run)
        env:
          KEEP_VOLUMES: "true"
        run: |
          cd test
          ./test.sh
      - id: test-script-2
        name: Test the initializers (Second run)
        run: |
          cd test
          ./test.sh
