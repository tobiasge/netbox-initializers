---
name: Publish release

on:
  release:
    types:
      - "released"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    name: Release to PyPi
    environment: pypi
    permissions:
      id-token: write
    steps:
      - id: git-checkout
        name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - id: build-and-publish
        name: Build and publish to pypi
        run: |
          uv build
          uv publish
